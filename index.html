<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirbs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="background-music" src="1-02. Dreamland Selection.mp3" loop></audio>

    <div class="scrolling-background"></div>
    <div class="star-sparkles" aria-hidden="true"></div>

    <div class="bulletin-board-container">
        <img src="board.png" alt="Bulletin Board" class="bulletin-board-image">

        <div class="board-item item-1">
            <a href="https://net0121.github.io/KH/" target="_blank" rel="noopener noreferrer" class="hover-glow-link">
                <img src="KHTEST.png" alt="KH Test" class="hover-glow-image">
            </a>
        </div>

        <div class="board-item item-2">
            <a href="https://net0121.github.io/mocean/" target="_blank" rel="noopener noreferrer" class="hover-glow-link">
                <img src="mocean.png" alt="mocean" class="hover-glow-image">
            </a>
        </div>

        <div class="board-item item-3">
            <a href="https://fun-facts.github.io/" target="_blank" rel="noopener noreferrer" class="hover-glow-link">
                <img src="funfacts.png" alt="Fun Facts" class="hover-glow-image">
            </a>
        </div>

        <button id="play-button">Start Music</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
