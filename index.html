<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirbs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="background-music" src="1-02. Dreamland Selection.mp3" loop></audio>

    <div class="scrolling-background"></div>
    <div class="star-sparkles" aria-hidden="true"></div>

    <div class="bulletin-board-container">
        <img src="board.png" alt="Bulletin Board" class="bulletin-board-image">

        <!-- Replace the href values below with your real destinations,
             and the img src values with your own artwork. -->
        <div class="board-item item-1">
            <a href="https://example.com/link-one" target="_blank" rel="noopener noreferrer" class="hover-glow-link">
                <img src="link-one.png" alt="Portal One" class="hover-glow-image">
            </a>
        </div>

        <div class="board-item item-2">
            <a href="https://example.com/link-two" target="_blank" rel="noopener noreferrer" class="hover-glow-link">
                <img src="link-two.png" alt="Portal Two" class="hover-glow-image">
            </a>
        </div>

        <div class="board-item item-3">
            <a href="https://example.com/link-three" target="_blank" rel="noopener noreferrer" class="hover-glow-link">
                <img src="link-three.png" alt="Portal Three" class="hover-glow-image">
            </a>
        </div>

        <button id="play-button">Start Music</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
